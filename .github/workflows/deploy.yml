name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # withastro/action builds the site AND uploads the Pages artifact in
      # one step -- it wraps actions/upload-pages-artifact internally. Adding
      # a separate upload-pages-artifact step here (as the first version of
      # this workflow did) creates two artifacts with the same default name
      # ("github-pages") in the same run, which GitHub rejects with a 409
      # Conflict. Don't re-add an "Upload artifact" step below.
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          path: ./site
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
